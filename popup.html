<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 250px;
      padding: 14px;
      margin: 0;
      text-align: center;
      background-color: #f9f9f9;
    }
    h3 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #333;
    }
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #e2e2e2;
    }
    .option-label {
      font-size: 12px;
      font-weight: 500;
      color: #444;
    }
    select {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 11px;
      background-color: #fff;
      outline: none;
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #007acc;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 10px 14px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
      transition: background 0.2s;
    }
    button:hover {
      background: #005999;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      word-break: break-word;
    }
    #progressContainer {
      display: none;
      margin-top: 12px;
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
    }
    #progressBar {
      width: 0%;
      height: 100%;
      background-color: #007acc;
      transition: width 0.2s ease-in-out;
      border-radius: 10px;
    }
    #progressText {
      display: none;
      font-size: 10px;
      font-weight: bold;
      color: #444;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>Gerador de Documentação</h3>
  
  <div class="option-row">
    <span class="option-label">Gerar tradução</span>
    <label class="switch">
      <input type="checkbox" id="translateToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <span class="option-label">Provedor preferencial</span>
    <select id="preferredServiceSelect">
      <option value="google">Google Translate</option>
      <option value="docker">Docker (Local)</option>
    </select>
  </div>

  <button id="exportBtn">Exportar para .ZIP</button>
  
  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>
  <div id="progressText">0%</div>

  <div id="status"></div>

  <script src="lib/turndown.js"></script>
  <script src="extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
